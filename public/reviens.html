<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviens - Perfect Loop Maker</title>
    <link rel="stylesheet" href="reviens/_styles.css">
</head>
<body>
    <div class="container">
        <h1>reviens://loop.maker</h1>

        <div class="credits">
            <a href="https://livecodingstrasbourg.github.io" target="_blank" class="credit-link">
                TOPLAP Strasbourg
            </a>
        </div>

        <!-- Step 1: Load Audio -->
        <div class="upload-section" id="uploadSection">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">♫</div>
                <div class="upload-text">Drop audio file or click to browse</div>
                <input type="file" id="fileInput" accept="audio/*">
            </div>
            <div id="fileName" class="file-name"></div>
            <div class="progress-bar" id="loadingProgress" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Main Workspace (hidden until file loaded) -->
        <div class="workspace" id="workspace" style="display: none;">

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-item file-info">
                    <span class="status-label">FILE</span>
                    <span class="status-value" id="fileNameDisplay">--</span>
                </div>
                <div class="status-item">
                    <span class="status-label">BPM</span>
                    <span class="status-value" id="bpmDisplay">--</span>
                </div>
                <div class="status-item">
                    <span class="status-label">KEY</span>
                    <span class="status-value" id="pitchDisplay">--</span>
                </div>
                <div class="status-item" id="qualityStatus">
                    <span class="status-label">LOOP</span>
                    <span class="status-value quality-indicator" id="qualityDisplay">--</span>
                </div>
                <div class="status-item selection-info">
                    <span class="status-label">SELECTION</span>
                    <span class="status-value" id="selectionDisplay">--</span>
                </div>
            </div>

            <!-- Waveform -->
            <div class="waveform-section">
                <div class="waveform-container">
                    <canvas id="waveformCanvas" height="150"></canvas>
                    <div class="beat-markers" id="beatMarkers"></div>
                    <div id="selectionOverlay" class="selection-overlay"></div>
                    <div id="playbackCursor" class="playback-cursor"></div>
                </div>
                <div class="waveform-hint" id="waveformHint">Click on waveform to set loop start point</div>
            </div>

            <!-- Loop Length Buttons -->
            <div class="loop-length-section">
                <div class="section-label">LOOP LENGTH</div>
                <div class="length-buttons" id="lengthButtons">
                    <button class="length-btn" data-beats="1">1 beat</button>
                    <button class="length-btn" data-beats="2">2 beats</button>
                    <button class="length-btn" data-beats="4" data-default="true">1 bar</button>
                    <button class="length-btn" data-beats="8">2 bars</button>
                    <button class="length-btn" data-beats="16">4 bars</button>
                    <button class="length-btn" data-beats="32">8 bars</button>
                </div>
                <div class="length-info" id="lengthInfo">@ 120 BPM: 1 bar = 2.00s</div>
            </div>

            <!-- Beat Navigation -->
            <div class="beat-nav-section">
                <button class="nav-btn" id="prevBeatBtn" title="Move to previous beat (←)">◀ PREV BEAT</button>
                <div class="current-position" id="currentPosition">Bars 1-4</div>
                <button class="nav-btn" id="nextBeatBtn" title="Move to next beat (→)">NEXT BEAT ▶</button>
            </div>

            <!-- Main Action Buttons -->
            <div class="action-buttons">
                <button class="action-btn loop-btn" id="loopBtn">
                    <span class="btn-icon">▶</span>
                    <span class="btn-text">LOOP</span>
                </button>
                <button class="action-btn analyze-btn" id="deepAnalyzeBtn">
                    <span class="btn-icon">◎</span>
                    <span class="btn-text">FIND LOOPS</span>
                </button>
                <button class="action-btn export-btn" id="exportBtn">
                    <span class="btn-icon">↓</span>
                    <span class="btn-text">EXPORT</span>
                </button>
            </div>

            <!-- Analysis Results Section -->
            <div class="analysis-results" id="analysisResults" style="display: none;">
                <div class="results-header">
                    <span class="results-title">Found Loops</span>
                    <button class="small-btn" id="clearResultsBtn">Clear</button>
                </div>
                <div class="results-list" id="resultsList"></div>
            </div>

            <!-- Zoom Control -->
            <div class="zoom-section">
                <label>ZOOM</label>
                <input type="range" id="zoomLevel" min="1" max="500" value="1" step="1">
                <span id="zoomValue">1x</span>
                <button class="small-btn" id="resetViewBtn">RESET</button>
            </div>

            <!-- Advanced Settings (Collapsible) -->
            <details class="advanced-section" id="advancedSection">
                <summary>Advanced Settings</summary>
                <div class="advanced-content">
                    <div class="setting-row">
                        <label>Crossfade (smoothness)</label>
                        <input type="range" id="crossfade" min="0" max="200" value="20" step="5">
                        <span id="crossfadeValue">20ms</span>
                    </div>
                    <div class="setting-row">
                        <label>Crossfade Type</label>
                        <select id="crossfadeType">
                            <option value="cosine" selected>Smooth (cosine)</option>
                            <option value="linear">Linear</option>
                            <option value="logarithmic">Logarithmic</option>
                            <option value="exponential">Exponential</option>
                        </select>
                    </div>
                    <div class="setting-row checkboxes">
                        <label class="checkbox-label">
                            <input type="checkbox" id="snapToBeat">
                            Snap to beat
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="snapToZero">
                            Snap to zero crossing
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="clickReduction" checked>
                            Click reduction
                        </label>
                    </div>
                    <div class="setting-row">
                        <label>Start (s)</label>
                        <input type="number" id="startTime" step="0.001" min="0" value="0">
                    </div>
                    <div class="setting-row">
                        <label>End (s)</label>
                        <input type="number" id="endTime" step="0.001" min="0.1" value="2">
                    </div>
                    <div class="setting-row">
                        <label>Duration (s)</label>
                        <input type="number" id="duration" step="0.001" min="0.1" value="2" readonly>
                    </div>
                </div>
            </details>

        </div>

        <!-- Export Progress -->
        <div id="exportProgress" class="export-progress" style="display: none;">
            <div class="export-content">
                <div class="export-title">Exporting...</div>
                <div id="exportStatus">Preparing...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="exportProgressFill"></div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="globalLoading" class="global-loading" style="display: none;">
            <div class="loading-content">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
                <div id="loadingMessage" class="loading-message">Processing...</div>
            </div>
        </div>

        <!-- Hidden inputs for compatibility -->
        <input type="hidden" id="bpm" value="120">
        <input type="hidden" id="pitch" value="--">
        <input type="hidden" id="beatLength" value="4">
        <input type="hidden" id="manualBeats" value="4">
        <input type="hidden" id="minDuration" value="1">
        <input type="hidden" id="maxDuration" value="16">
        <input type="hidden" id="searchMode" value="full_track">
        <input type="hidden" id="precisionMode" value="false">
        <div id="loopAnalysis" style="display:none;"></div>
        <div id="loopSuggestions" style="display:none;"></div>
        <div id="suggestionsList" style="display:none;"></div>
        <div id="trackInfo" style="display:none;"></div>
        <input type="range" id="navigationSlider" style="display:none;" min="0" max="100" value="0">

    </div>

    <!-- Scripts -->
    <script src="reviens/audio-utils.js"></script>
    <script src="reviens/audio-engine.js"></script>
    <script src="reviens/loop-analyzer.js"></script>
    <script src="reviens/pitch-detector.js"></script>
    <script src="reviens/playback-manager.js"></script>
    <script src="reviens/export-manager.js"></script>
    <script src="reviens/main.js"></script>
</body>
</html>
